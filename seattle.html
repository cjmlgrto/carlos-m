<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Thanksgiving Adventures. Where we're staying, eating and exploring in Seattle, Nov 25 to Dec 2.">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="Seattle">
<meta property="og:description" content="Thanksgiving Adventures">
<meta property="og:type" content="website">
<meta property="og:url" content="https://carlos-m.com/seattle">
<meta property="og:image" content="https://carlos-m.com/seattle/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A map of Seattle with pins, titled Seattle, Thanksgiving Adventures.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Seattle">
<meta name="twitter:description" content="Thanksgiving Adventures">
<meta name="twitter:image" content="https://carlos-m.com/seattle/og.png">
<title>Seattle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
/* VOICE a single-column Apple-style document: calm, left-aligned, no ornament
   IDEA an Apple support/newsroom article with inline Apple Maps-like figures
   PICTURE one plain map per section, under its heading, with numbered pins that open the system map app
   COLOUR system background and labels; map land/water greys and blues; pins in section colour
   TYPE system font (SF)
   LAYOUT one 640px column, everything flush left; same on phone */
:root{color-scheme:light dark;--font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
--bg:light-dark(#ffffff,#000000);--label:light-dark(#1d1d1f,#f5f5f7);--secondary:light-dark(#6e6e73,#98989d);
--divider:light-dark(#e4e4e7,#222223);--tile:light-dark(#ffffff,#1c1c1e);--tile-edge:light-dark(rgba(0,0,0,.1),rgba(255,255,255,.12));
--red:light-dark(#ff383c,#ff4245);--accent:light-dark(#0066cc,#2997ff);--bar:light-dark(rgba(255,255,255,.85),rgba(0,0,0,.8));
--land:var(--m-land);--park:var(--m-park);--water:var(--m-water);--maptext:var(--m-maptext);
--stay:#af52de;--eat:#ff9500;--do:#ff2d55}
:root{--m-land:#f9f8f4;--m-park:#c3e0a3;--m-water:#8cc9f2;--m-maptext:#5b5b60;--m-halo:#fff;--m-hwy:#b4b7b9;--m-hwyc:#fff;--m-watert:#4f86c6;--m-city:#3a3a3c;--m-parkt:#3f7f45;--m-parkc:#4caf50;--m-needle:#a9c8f7;--m-needlei:#2d3440;--m-needlet:#6e6e73;--m-medge:rgba(0,0,0,.1);--m-btn:rgba(255,255,255,.72);--m-btnh:rgba(255,255,255,.85);--m-btnt:#007aff;--m-shd:.14;--m-refd:#1d1d1f;--m-pinring:#fff;--m-road:#fff;--m-roadc:#e4e2dc}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--m-land:#2b3445;--m-park:#1f4a45;--m-water:#16255c;--m-maptext:#a3abbc;--m-halo:#2b3445;--m-hwy:#4b5870;--m-hwyc:#2b3445;--m-watert:#7f9ee3;--m-city:#e6e9ef;--m-parkt:#6cc08f;--m-parkc:#3f9a5c;--m-needle:#3b4c70;--m-needlei:#d6dcea;--m-needlet:#a3abbc;--m-medge:rgba(255,255,255,.14);--m-btn:rgba(40,44,56,.72);--m-btnh:rgba(52,57,72,.85);--m-btnt:#4a9dff;--m-shd:.4;--m-refd:#e6e9ef;--m-pinring:#fff;--m-road:#3a4559;--m-roadc:#2b3445}}
:root[data-theme=dark]{--m-land:#2b3445;--m-park:#1f4a45;--m-water:#16255c;--m-maptext:#a3abbc;--m-halo:#2b3445;--m-hwy:#4b5870;--m-hwyc:#2b3445;--m-watert:#7f9ee3;--m-city:#e6e9ef;--m-parkt:#6cc08f;--m-parkc:#3f9a5c;--m-needle:#3b4c70;--m-needlei:#d6dcea;--m-needlet:#a3abbc;--m-medge:rgba(255,255,255,.14);--m-btn:rgba(40,44,56,.72);--m-btnh:rgba(52,57,72,.85);--m-btnt:#4a9dff;--m-shd:.4;--m-refd:#e6e9ef;--m-pinring:#fff;--m-road:#3a4559;--m-roadc:#2b3445}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box;min-width:0}
html{scroll-padding-top:60px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--label);font:400 17px/1.47 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow-x:clip}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.column{max-width:640px;margin:0 auto;padding:0 20px}

header.column{padding:48px 20px 8px}
h1{font-size:clamp(40px,10vw,48px);font-weight:700;line-height:1.08;letter-spacing:-.02em}
.lede{margin-top:12px;font-size:21px;line-height:1.38;color:var(--secondary)}

.dates{list-style:none;margin-top:32px}
.date{display:flex;align-items:flex-start;gap:14px;padding:12px 0;border-top:1px solid var(--divider)}
.date:last-child{border-bottom:1px solid var(--divider)}
.cal{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:44px;height:44px;border-radius:10px;background:var(--tile);box-shadow:inset 0 0 0 1px var(--tile-edge);font-weight:700}
.cal .m{font-size:11px;line-height:12px;color:var(--red);text-transform:uppercase}
.cal .d{font-size:17px;line-height:18px}
.what{font-size:13px;color:var(--secondary)}
.when{font-weight:500}

nav{position:sticky;top:0;z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--divider)}
nav{overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
nav::-webkit-scrollbar{display:none}
nav .column{display:flex;gap:22px;align-items:center;white-space:nowrap;max-width:none;width:max-content;padding:0 max(20px,calc(50vw - 300px))}
nav a{flex:none}
.count{font-weight:400;color:var(--secondary);margin-left:6px}
nav a{display:flex;align-items:center;min-height:48px;color:var(--secondary);font-size:15px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
nav a:hover{text-decoration:none;color:var(--label)}
nav a.on{color:var(--label);border-color:var(--label)}

section{padding-top:48px}
h2{font-size:28px;font-weight:700;line-height:1.12;letter-spacing:-.015em}
.intro{margin-top:10px;color:var(--secondary)}
h3{font-size:21px;font-weight:600;line-height:1.25;margin-top:36px}
h4{font-size:15px;font-weight:600;color:var(--secondary);margin-top:28px;padding-bottom:8px;border-bottom:1px solid var(--divider)}

.map{position:relative;height:300px;margin-top:20px;border-radius:12px;overflow:hidden;background:var(--water);}
.map::after,.thumb::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px var(--m-medge);pointer-events:none;z-index:1}
.map.tall{height:440px}
.map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.map .land,.thumb .land{fill:var(--land)}
.map .park,.thumb .park{fill:var(--park)}
.map .ref-d{fill:var(--m-refd);font-weight:700}
.map .wat{fill:var(--water)}
.map .shd,.thumb .shd{fill:#000;fill-opacity:var(--m-shd)}
.obtn{position:absolute;right:10px;bottom:10px;z-index:2;display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 14px;border-radius:999px;border:0;background:var(--m-btn);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 0 0 1px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.04);color:var(--m-btnt);font:600 13px var(--font);text-decoration:none}
.obtn:hover{text-decoration:none;background:var(--m-btnh)}
.obtn svg{position:static;inset:auto;display:block;width:9px;height:9px;fill:currentColor}
.obtn:focus-visible{outline:2px solid #007aff;outline-offset:2px}
.map .st{fill:none;stroke:var(--m-road);stroke-linejoin:round;stroke-linecap:round}
.map .st-c{fill:none;stroke:var(--m-roadc);stroke-linejoin:round;stroke-linecap:round}
.map .st-t{fill:var(--m-maptext);font-weight:500}
.map .hwy{fill:none;stroke:var(--m-hwy);stroke-linejoin:round;stroke-linecap:round}
.map .hwy-c{fill:none;stroke:var(--m-hwyc);stroke-linejoin:round;stroke-linecap:round}
.map .sh-b{fill:#2f5fb3;stroke:#fff}
.map .sh-r{fill:#d33a3a}
.map .shield text{fill:#fff;font-family:var(--font);font-weight:700;text-anchor:middle;dominant-baseline:central;stroke:none}
.map text{paint-order:stroke;stroke:var(--m-halo);stroke-opacity:.9;font-family:var(--font);text-anchor:middle;dominant-baseline:central}
.map .area{fill:var(--m-maptext);font-weight:600;letter-spacing:.06em}
.map .water{fill:var(--m-watert);font-style:italic;font-weight:500;stroke:none}
.map .city{fill:var(--m-city);font-weight:700}
.map .park-c{fill:var(--m-parkc);stroke:var(--m-pinring)}
.map .park-t{fill:var(--m-parkt);font-weight:600}
.map .poi-t{font-weight:600}
.map .needle-c{fill:var(--m-needle);stroke:var(--m-pinring)}
.map .needle path{fill:none;stroke:var(--m-needlei);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.map .needle path:nth-child(2){fill:var(--m-needlei)}
.map .needle-t{fill:var(--m-needlet);font-weight:600;letter-spacing:.04em}

.map .pin circle,.thumb .pin circle{stroke:#fff}
.map .pin text{fill:#fff;font-family:var(--font);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.map a:hover .pin,.map a:focus-visible .pin{opacity:.85}
.cap{margin-top:8px;font-size:13px;color:var(--secondary)}

.rows{list-style:none}
.rows li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 14px;padding:14px 0;position:relative}
.rows li+li::before{content:'';position:absolute;top:0;left:78px;right:0;height:1px;background:var(--divider)}
.num{grid-row:span 3;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.thumb{grid-row:span 6;flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--water);position:relative;display:block}
.thumb svg{display:block;width:100%;height:100%}
.thumb .land{fill:var(--land)}
.thumb .pin circle{stroke:#fff}
.thumb .pin text{fill:#fff;font-family:var(--font);font-weight:700;text-anchor:middle;dominant-baseline:central}
.thumb .poi{width:16px;height:18px;fill:var(--maptext)}
.thumb.off{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;font-size:11px;color:var(--secondary);background:var(--land);text-align:center;line-height:1.2;padding:4px}
.rows li{align-items:start;content-visibility:auto;contain-intrinsic-size:auto 120px}
.num.none{background:transparent;color:var(--secondary);box-shadow:inset 0 0 0 1px var(--divider)}
.name{font-weight:600}
.sub,.note,.closed{grid-column:2;font-size:15px;color:var(--secondary)}
.done .name{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--secondary)}
.done .sub{opacity:.55}
.hrs.open{color:light-dark(#248a3d,#30d158)}
.hrs.shut{color:var(--secondary);opacity:.7}
.name .must{width:13px;height:13px;margin:0 0 0 6px;vertical-align:-1px;color:light-dark(#ff9500,#ffb340);fill:currentColor}
.ic{width:13px;height:13px;fill:currentColor;vertical-align:-1px;margin-right:6px}
.mkt{grid-column:2;font-size:15px;font-weight:600;color:var(--label)}
.must{grid-column:2;font-size:15px;font-weight:600;color:light-dark(#c25e00,#ffb340)}
.stay .line{font-size:15px}
.stay .meta+.line{margin-top:8px}
.stay .meta{margin-top:2px}
.steps{margin:8px 0 0;padding-left:20px;font-size:15px;color:var(--secondary)}
.rows li.st{display:flex;gap:14px;align-items:flex-start}
.st .body{display:flex;flex-direction:column;gap:2px;flex:1}
.st .links{margin-top:6px;flex-wrap:wrap}
.st .specs{display:flex;gap:16px}
.steps li{padding:2px 0}
.specs{display:flex;gap:16px}
.specs .ic{margin-right:5px}
.sline{display:block;color:var(--secondary)}
.note{color:var(--label)}
.x{width:9px;height:9px;fill:currentColor;margin-left:4px;vertical-align:0}
.links{grid-column:3;grid-row:1;display:flex;gap:16px;font-size:15px;white-space:nowrap;align-self:baseline}
#eat .num{background:var(--eat)}#stay .num{background:var(--stay)}#do .num{background:var(--do)}
#eat .num.none{background:transparent}
.map .lead{stroke:var(--maptext)}
.maplabel{font-size:13px;color:var(--secondary);margin-top:20px}
.maplabel+.map{margin-top:8px}

.stay{padding:20px 0;border-bottom:1px solid var(--divider)}
.stay:first-of-type{margin-top:24px}
.stay .head{display:flex;align-items:flex-start;gap:12px}
.stay .head{gap:16px}
.stay .title{font-size:19px;font-weight:600;line-height:1.3}
.stay .price{font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.stay .meta{font-size:15px;color:var(--secondary)}
.stay p{margin-top:8px}
.more{display:inline-block;margin-top:10px}


.short{list-style:none;margin-top:8px}
.short li{padding:10px 0;border-bottom:1px solid var(--divider)}
.short b{font-weight:600}
.short span{color:var(--secondary)}

footer.column{padding:48px 20px 64px;font-size:13px;color:var(--secondary)}
@media(max-width:480px){.rows li{grid-template-columns:auto minmax(0,1fr)}.links{grid-column:2;grid-row:auto;margin-top:4px}.map.tall{height:400px}}
@media(prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>

    let k=0;while(!freeR(ex,ey)&&k++<10){if(horiz)ex-=34*u;else ey-=34*u}
    taken.push([ex,ey]);
    const mi=Math.round(miles(ctr,r.ll)),ang=Math.atan2(dy,dx);
    const ax=ex+Math.cos(ang)*17*u,ay=ey+Math.sin(ang)*17*u,deg=ang*180/Math.PI;
    offSvg+=`<a href="${href}" aria-label="${esc(r.n)}, ${mi} miles"><title>${esc(r.n)}, ${mi} mi</title><path d="M${ax+4*u} ${ay}L${ax-3*u} ${ay-4.5*u}L${ax-3*u} ${ay+4.5*u}Z" fill="${r.c}" transform="rotate(${deg} ${ax} ${ay})"/>${refPin(ex,ey,r)}${T('ref-d',ex,ey-19*u,mi+' mi',10)}</a>`;
    return '';
  }).join('');
  const pins=leads+refSvg+pts.map((p,i)=>{const [x,y]=pos[i];return `<a href="${mapUrl(p)}" aria-label="${esc(p.n)}"><title>${esc(p.n)}</title>${wide?`<circle cx="${x}" cy="${y}" r="${5*u}" fill="${p.col||cols[key]}" stroke="#fff" stroke-width="${1.5*u}"/>`:pin(x,y,u,p.col||cols[key],p.ic)}</a>`}).join('');
  el.innerHTML=`<svg viewBox="${vx} ${vy} ${vw} ${vh}" xmlns="http://www.w3.org/2000/svg"><use href="#land" class="land"/><use href="#parks" class="park"/>${base}${lab}${pins}${offSvg}</svg><a class="obtn" target="_blank" rel="noopener" href="https://maps.apple.com/?ll=${ctr[0].toFixed(5)},${ctr[1].toFixed(5)}&spn=${(vh/1e4).toFixed(4)},${(vw/(K*1e4)).toFixed(4)}">Open in Maps<svg aria-hidden="true"><use href="#i-ext"/></svg></a>`;
 };
 const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){io.disconnect();draw();const ro=new ResizeObserver(draw);ro.observe(el)}},{rootMargin:'400px 0px'});io.observe(el);
});

/* External links: open in a new tab, trailing arrow */
document.querySelectorAll('main a[href^="http"]').forEach(l=>{if(l.closest('.map')||l.classList.contains('thumb'))return;l.target='_blank';l.rel='noopener';l.insertAdjacentHTML('beforeend','<svg class="x" aria-hidden="true"><use href="#i-ext"/></svg>')});
document.querySelectorAll('main a.thumb, .map a').forEach(l=>{l.target='_blank';l.rel='noopener'});

/* Nav */
const tabs=[...document.querySelectorAll('nav a')];
const secs=tabs.map(a=>document.querySelector(a.getAttribute('href')));
let cur=0;const mark=()=>{let i=0;secs.forEach((s,j)=>{if(s.getBoundingClientRect().top<120)i=j});
 if(innerHeight+scrollY>=document.body.scrollHeight-4)i=secs.length-1;
 if(i!==cur){cur=i;const t=tabs[i],n=document.querySelector('nav');n.scrollTo({left:t.offsetLeft-n.clientWidth/2+t.offsetWidth/2,behavior:'smooth'})}
 tabs.forEach((a,j)=>a.classList.toggle('on',j===i))};
addEventListener('scroll',mark,{passive:true});mark();
}
</script>
